<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>蓝星迭代日志</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="description"
      content="蓝星迭代日志：记录技术、行业与生活中的理解、实践和反思。"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-okaidia.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs@1/plugins/line-numbers/prism-line-numbers.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs@1/plugins/line-highlight/prism-line-highlight.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    />
  </head>

  <body>
    <div id="app"></div>
    <!-- Docsify v4 -->
    <script>
      window.$docsify = {
        name: "蓝星迭代日志",
        repo: "bamboosjtu/bamboosjtu.github.io",
        loadSidebar: true,
        // Revalidate Markdown after deployments instead of reusing a stale HTTP response.
        requestHeaders: { "Cache-Control": "no-cache" },
        sidebarDisplayLevel: 0,
        subMaxLevel: 4,
        coverpage: "cover.md",
        homepage: "home.md",
        themeColor: "#2457d6",
        auto2top: true,
        mergeNavbar: true,
        search: {
          maxAge: 86400000,
          paths: "auto",
          placeholder: "搜索研究笔记",
          noData: "没有找到相关笔记",
        },
      };
      window.$docsify.plugins = (window.$docsify.plugins || []).concat(
        function (hook, vm) {
          hook.doneEach(function () {
            const sidebar = document.querySelector(".sidebar-nav");
            if (sidebar) {

                sidebar.querySelectorAll("li").forEach(function (item) {
                const children = Array.from(item.children);
                // Marked wraps links in <p> when a Markdown list is loose.
                const link = item.querySelector(":scope > a, :scope > p > a");
                const nestedList = children.find(function (child) {
                  return (
                    child.tagName === "UL" &&
                    !child.classList.contains("app-sub-sidebar")
                  );
                });

                if (!link || !nestedList) return;

                item.classList.add("nav-branch");
                // 默认折叠：分支首次创建时收起；用户点开后把状态写进 sessionStorage，
                // 同一会话内切页（doneEach 再次执行）不会被重新折叠。
                // 已存在的分支不覆盖用户当前的选择。

                let toggle = children.find(function (child) {
                  return child.classList && child.classList.contains("sidebar-branch-toggle");
                });

                if (!toggle) {
                  toggle = document.createElement("button");
                  toggle.className = "sidebar-branch-toggle";
                  toggle.type = "button";
                  toggle.setAttribute("aria-label", "展开或收起 " + link.textContent.trim());
                  item.insertBefore(toggle, nestedList);

                  const branchKey =
                    "sidebar-branch:" + (link.getAttribute("href") || link.textContent.trim());
                  let stored = null;

                  try {
                    stored = window.sessionStorage.getItem(branchKey);
                  } catch (error) {
                    stored = null;
                  }

                  item.classList.toggle("is-collapsed", stored === null || stored === "1");

                  toggle.addEventListener("click", function (event) {
                    event.preventDefault();
                    event.stopPropagation();
                    const collapsed = item.classList.toggle("is-collapsed");
                    toggle.setAttribute("aria-expanded", String(!collapsed));

                    try {
                      window.sessionStorage.setItem(branchKey, collapsed ? "1" : "0");
                    } catch (error) {
                      // 隐私模式无法写入会话存储时，仅保留当前页面的折叠状态。
                    }
                  });
                }


                toggle.setAttribute(
                  "aria-expanded",
                  String(!item.classList.contains("is-collapsed"))
                );
              });
            }

            if (window.__pageTocScrollHandler) {
              window.removeEventListener(
                "scroll",
                window.__pageTocScrollHandler
              );
              window.__pageTocScrollHandler = null;
            }

            const existingToc = document.querySelector(".page-toc");
            if (existingToc) existingToc.remove();
            document.body.classList.remove("has-page-toc");

            const article = document.querySelector(".markdown-section");
            const isHome = vm.route.path === "/";
            const headings = article
              ? Array.from(article.querySelectorAll("h2[id], h3[id]"))
              : [];

            if (!isHome && article && headings.length >= 2) {
              const toc = document.createElement("aside");
              toc.className = "page-toc";
              toc.setAttribute("aria-label", "文章大纲");

              const tocLabel = document.createElement("span");
              tocLabel.className = "page-toc__label";
              tocLabel.textContent = "文章大纲";

              const tocNav = document.createElement("nav");
              tocNav.className = "page-toc__nav";

              const links = headings.map(function (heading) {
                const link = document.createElement("a");
                const anchor = heading.querySelector("a.anchor");
                link.href = anchor
                  ? anchor.getAttribute("href")
                  : window.location.hash.split("?id=")[0] + "?id=" + heading.id;
                link.textContent = heading.textContent.trim();
                link.className =
                  heading.tagName === "H3" ? "page-toc__level-3" : "page-toc__level-2";
                tocNav.appendChild(link);
                return link;
              });

              toc.appendChild(tocLabel);
              toc.appendChild(tocNav);
              document.querySelector(".content").appendChild(toc);
              document.body.classList.add("has-page-toc");

              const updateActiveHeading = function () {
                let activeIndex = 0;
                headings.forEach(function (heading, index) {
                  if (heading.getBoundingClientRect().top <= 150) {
                    activeIndex = index;
                  }
                });
                links.forEach(function (link, index) {
                  link.classList.toggle("is-active", index === activeIndex);
                });
              };

              window.__pageTocScrollHandler = updateActiveHeading;
              window.addEventListener("scroll", updateActiveHeading, {
                passive: true,
              });
              updateActiveHeading();
            }

            // docsify 每次渲染/切页后触发
            if (typeof renderMathInElement === "function") {
              // 建议只渲染 docsify 的内容区域，避免污染侧边栏等
              const el = document.querySelector(".content") || document.body;

              renderMathInElement(el, {
                delimiters: [
                  { left: "$$", right: "$$", display: true },
                  { left: "$", right: "$", display: false },
                  { left: "\\(", right: "\\)", display: false },
                  { left: "\\[", right: "\\]", display: true },
                ],
                throwOnError: false,
                // 可选：减少误伤
                ignoredTags: [
                  "script",
                  "noscript",
                  "style",
                  "textarea",
                  "pre",
                  "code",
                ],
              });
            }
          });
        }
      );
    </script>
    <!-- Mermaid 先注册插件，再启动 Docsify；由切页钩子渲染，避免重复扫描。 -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.8.0/dist/mermaid.min.js"></script>
    <script>
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "strict",
        theme: "default",
        flowchart: { htmlLabels: false },
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>

    <!-- Docsify 核心 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

    <!-- 官方插件 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>

    <!-- Prism 高亮 -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-clike.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/plugins/line-highlight/prism-line-highlight.min.js"></script>

    <!-- KaTeX 核心 -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- 自动渲染插件 -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  </body>
</html>
